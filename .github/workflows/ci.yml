name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          cache: npm

      - name: Syntax checks
        run: |
          node --check karaoke_explorer.js
          node --check sw.js
          node --check qrcode.js
          node --check scripts/bump-version.js
          node --check scripts/check-versions.js
          node --check scripts/smoke.js
          node --check scripts/regression.js
          node --check scripts/generate-icons.js
          node --check scripts/accessibility.js
          node --check scripts/loading.js
          node --check scripts/performance.js
          node --check scripts/offline.js
          node --check personal-songbook.js
          node --check scripts/personal.js
          node --check stage-effects.js
          node --check scripts/effects.js
          node --check scripts/enrich-eras.js
          node --check scripts/enrich-eras-musicbrainz.js
          node scripts/check-era-enrichment.js
          node scripts/test-era-enrichment.js
          node --check scripts/lib/music-metadata.js
          node --check scripts/enrich-getsongbpm.js
          node --check scripts/check-audio-enrichment.js
          node scripts/test-getsongbpm.js
          node --check scripts/audio.js
          node --check scripts/sync-venue.js
          node scripts/test-sync-venue.js
          node --check scripts/test-weekly-songbook.js
          node scripts/test-weekly-songbook.js
          if [ -f audio_enrichment.json ]; then node scripts/check-audio-enrichment.js; fi

      - name: Version consistency
        run: node scripts/check-versions.js

      - name: Install Playwright
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps "$BROWSER"

      - name: Browser checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 1
          node scripts/smoke.js
          node scripts/regression.js
          node scripts/accessibility.js
          node scripts/personal.js
          node scripts/effects.js
          node scripts/first-visit.js
          node scripts/audio.js
          node scripts/offline.js
          node scripts/test-weekly-songbook.js --browser

      - name: Input during catalog loading
        if: matrix.browser == 'chromium'
        run: node scripts/loading.js

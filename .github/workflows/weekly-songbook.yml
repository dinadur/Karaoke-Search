name: Weekly songbook update

on:
  schedule:
    - cron: '17 9 * * 1' # Mondays, 09:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check the venue without publishing changes'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-songbook.yml'
      - 'scripts/sync-venue.js'
      - 'scripts/test-sync-venue.js'
      - 'scripts/test-venue-workflow.js'

concurrency:
  group: weekly-songbook-update
  # Superseded importer code should not hold up the corrected run.
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      added: ${{ steps.sync.outputs.added }}
      sha: ${{ steps.checkout.outputs.sha }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      archive_sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      # Later jobs check out this exact commit, so publication can detect a
      # change to main made at any point after the catalog was prepared.
      - name: Record prepared commit
        id: checkout
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          cache: npm

      - name: Test the importer
        run: |
          node scripts/test-sync-venue.js
          node scripts/test-venue-workflow.js
          node scripts/test-weekly-songbook.js

      - name: Fetch new venue songs
        id: sync
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/sync-venue.js
          else
            node scripts/sync-venue.js --write
          fi

      - name: Validate updated catalog
        if: steps.sync.outputs.added != '0' && !inputs.dry_run
        run: |
          node --check karaoke_explorer.js
          node --check sw.js
          node scripts/check-versions.js
          node scripts/check-era-enrichment.js
          node scripts/check-audio-enrichment.js
          git diff --check

      # Capture the validated files before any third-party npm code is loaded.
      # The publication job only consumes this immutable artifact.
      - name: Package validated additions
        id: package
        if: steps.sync.outputs.added != '0' && !inputs.dry_run
        run: |
          tar -cf metadata_cache/songbook-update.tar \
            karaoke_songs_enriched.json audio_enrichment.json era_enrichment.json \
            karaoke_explorer.js karaoke_explorer.html manifest.json sw.js
          digest=$(sha256sum metadata_cache/songbook-update.tar)
          digest=${digest%% *}
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Save validated additions
        id: artifact
        if: steps.sync.outputs.added != '0' && !inputs.dry_run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-songbook-update
          path: metadata_cache/songbook-update.tar
          if-no-files-found: error
          retention-days: 1

      - name: Save sync report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: venue-sync-report
          path: metadata_cache/venue-sync-report.json
          if-no-files-found: ignore
          retention-days: 30

  verify:
    needs: prepare
    if: needs.prepare.outputs.added != '0' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          cache: npm
      - name: Download validated additions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          merge-multiple: true
          path: metadata_cache/verify
      - name: Apply validated additions
        env:
          UPDATE_SHA256: ${{ needs.prepare.outputs.archive_sha256 }}
        run: |
          cd metadata_cache/verify
          [[ "$UPDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  songbook-update.tar\n' "$UPDATE_SHA256" | sha256sum --check --strict
          tar -xf songbook-update.tar -C ../..
      - name: Install browser checks
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify updated songbook in browser
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/karaoke-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/karaoke_explorer.html > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.js
          node scripts/regression.js
          node scripts/personal.js
          node scripts/audio.js
          node scripts/offline.js

  publish:
    needs: [prepare, verify]
    if: needs.prepare.outputs.added != '0' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Download validated additions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          merge-multiple: true
          path: metadata_cache/publish
      - name: Verify and apply validated additions
        env:
          UPDATE_SHA256: ${{ needs.prepare.outputs.archive_sha256 }}
        run: |
          cd metadata_cache/publish
          # The expected digest is a prepare-job output, never downloaded with
          # the archive. A replaced/deleted artifact name cannot authorize bytes.
          [[ "$UPDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  songbook-update.tar\n' "$UPDATE_SHA256" | sha256sum --check --strict
          tar -tf songbook-update.tar | while IFS= read -r file; do
            case "$file" in
              karaoke_songs_enriched.json|audio_enrichment.json|era_enrichment.json|karaoke_explorer.js|karaoke_explorer.html|manifest.json|sw.js) ;;
              *) echo "Unexpected publication file: $file"; exit 1 ;;
            esac
          done
          tar -xf songbook-update.tar -C ../..
      # Validation and the commit run without the write token; only the
      # final push step receives it.
      - name: Revalidate and commit additions
        id: commit
        env:
          ADDED: ${{ needs.prepare.outputs.added }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Main changed during validation; rerun on the latest catalog.'
            exit 1
          fi
          node --check karaoke_explorer.js
          node --check sw.js
          node scripts/check-versions.js
          node scripts/check-era-enrichment.js
          node scripts/check-audio-enrichment.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add karaoke_songs_enriched.json audio_enrichment.json era_enrichment.json \
            karaoke_explorer.js karaoke_explorer.html manifest.json sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Sync venue songbook: ${ADDED} new songs"
          echo 'created=true' >> "$GITHUB_OUTPUT"
      - name: Publish additions
        if: steps.commit.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:main

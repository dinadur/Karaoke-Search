name: Weekly songbook update

on:
  schedule:
    - cron: '17 9 * * 1' # Mondays, 09:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check the venue without publishing changes'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-songbook.yml'
      - 'scripts/sync-venue.js'
      - 'scripts/test-sync-venue.js'

concurrency:
  group: weekly-songbook-update
  # Superseded importer code should not hold up the corrected run.
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      added: ${{ steps.sync.outputs.added }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Test the importer
        run: node scripts/test-sync-venue.js

      - name: Fetch new venue songs
        id: sync
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/sync-venue.js
          else
            node scripts/sync-venue.js --write
          fi

      - name: Validate updated catalog
        if: steps.sync.outputs.added != '0' && !inputs.dry_run
        run: |
          node --check karaoke_explorer.js
          node --check sw.js
          node scripts/check-versions.js
          node scripts/check-era-enrichment.js
          node scripts/check-audio-enrichment.js
          git diff --check

      # Capture the validated files before any third-party npm code is loaded.
      # The publication job only consumes this immutable artifact.
      - name: Package validated additions
        if: steps.sync.outputs.added != '0' && !inputs.dry_run
        run: |
          tar -cf metadata_cache/songbook-update.tar \
            karaoke_songs_enriched.json audio_enrichment.json era_enrichment.json \
            karaoke_explorer.js karaoke_explorer.html manifest.json sw.js
          (cd metadata_cache && sha256sum songbook-update.tar > songbook-update.tar.sha256)

      - name: Save validated additions
        if: steps.sync.outputs.added != '0' && !inputs.dry_run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-songbook-update
          path: |
            metadata_cache/songbook-update.tar
            metadata_cache/songbook-update.tar.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Save sync report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: venue-sync-report
          path: metadata_cache/venue-sync-report.json
          if-no-files-found: ignore
          retention-days: 30

  verify:
    needs: prepare
    if: needs.prepare.outputs.added != '0' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Download validated additions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-songbook-update
          path: metadata_cache/verify
      - name: Apply validated additions
        run: |
          cd metadata_cache/verify
          sha256sum --check songbook-update.tar.sha256
          tar -xf songbook-update.tar -C ../..
      - name: Install browser checks
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify updated songbook in browser
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/karaoke-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/karaoke_explorer.html > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.js
          node scripts/regression.js
          node scripts/personal.js
          node scripts/audio.js
          node scripts/offline.js

  publish:
    needs: [prepare, verify]
    if: needs.prepare.outputs.added != '0' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Download validated additions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-songbook-update
          path: metadata_cache/publish
      - name: Verify and apply validated additions
        run: |
          cd metadata_cache/publish
          sha256sum --check songbook-update.tar.sha256
          tar -tf songbook-update.tar | while IFS= read -r file; do
            case "$file" in
              karaoke_songs_enriched.json|audio_enrichment.json|era_enrichment.json|karaoke_explorer.js|karaoke_explorer.html|manifest.json|sw.js) ;;
              *) echo "Unexpected publication file: $file"; exit 1 ;;
            esac
          done
          tar -xf songbook-update.tar -C ../..
      - name: Revalidate and publish additions
        env:
          ADDED: ${{ needs.prepare.outputs.added }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Main changed during validation; rerun on the latest catalog.'
            exit 1
          fi
          node --check karaoke_explorer.js
          node --check sw.js
          node scripts/check-versions.js
          node scripts/check-era-enrichment.js
          node scripts/check-audio-enrichment.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add karaoke_songs_enriched.json audio_enrichment.json era_enrichment.json \
            karaoke_explorer.js karaoke_explorer.html manifest.json sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Sync venue songbook: ${ADDED} new songs"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:main

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Karaoke Finder</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="karaoke_explorer.css?v=20260510-3">
    <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script defer src="karaoke_explorer.js?v=20260510-3"></script>
</head>
<body>
    <header class="topbar">
        <div>
            <p class="eyebrow">Karaoke songbook</p>
            <h1>Find tonight's song</h1>
        </div>
        <div class="status" id="status">Loading songbook</div>
    </header>

    <main class="shell">
        <section class="toolbar" aria-label="Song search tools">
            <div class="search-box">
                <i data-lucide="search" aria-hidden="true"></i>
                <input id="searchInput" type="search" autocomplete="off" placeholder="Search song titles" aria-label="Search song titles">
                <label class="fuzzy-toggle">
                    <input id="fuzzySearch" type="checkbox">
                    <span>Fuzzy</span>
                </label>
            </div>
            <button id="randomButton" class="command" type="button" title="Random song">
                <i data-lucide="shuffle" aria-hidden="true"></i>
                <span>Random</span>
            </button>
            <button id="clearButton" class="icon-button" type="button" title="Clear search">
                <i data-lucide="x" aria-hidden="true"></i>
            </button>
            <button id="themeButton" class="icon-button" type="button" title="Dark mode" aria-label="Dark mode">
                <i data-lucide="moon" aria-hidden="true"></i>
            </button>
        </section>

        <section class="mode-tabs" aria-label="View mode">
            <button id="searchModeButton" class="mode-tab is-active" type="button">
                <i data-lucide="search" aria-hidden="true"></i>
                <span>Search</span>
            </button>
            <button id="browseModeButton" class="mode-tab" type="button">
                <i data-lucide="list-tree" aria-hidden="true"></i>
                <span>Browse</span>
            </button>
        </section>

        <section class="search-scope" id="searchScope" aria-label="Search by">
            <label>
                <input type="radio" name="searchScope" value="song" checked>
                <span>Song title</span>
            </label>
            <label>
                <input type="radio" name="searchScope" value="artist">
                <span>Artist</span>
            </label>
        </section>

        <section class="search-filters" id="searchFilters" aria-label="Filter search results">
            <label class="select-filter" for="moodFilter">
                <span class="filter-label">Mood</span>
                <select id="moodFilter" aria-label="Filter by mood">
                    <option value="">Any mood</option>
                </select>
            </label>
            <label class="select-filter" for="genreFilter">
                <span class="filter-label">Genre</span>
                <select id="genreFilter" aria-label="Filter by genre">
                    <option value="">Any genre</option>
                </select>
            </label>
            <label class="select-filter" for="decadeFilter">
                <span class="filter-label">Decade</span>
                <select id="decadeFilter" aria-label="Filter by decade">
                    <option value="">Any decade</option>
                </select>
            </label>
            <label class="select-filter" for="holidayFilter">
                <span class="filter-label">Holiday</span>
                <select id="holidayFilter" aria-label="Filter by holiday">
                    <option value="">Any holiday</option>
                </select>
            </label>
            <div class="filter-checks" aria-label="More filters">
                <label>
                    <input id="duetFilter" type="checkbox">
                    <span>Duet</span>
                </label>
                <label>
                    <input id="explicitFilter" type="checkbox">
                    <span>Explicit</span>
                </label>
                <button id="clearFiltersButton" class="filter-clear" type="button" title="Clear filters" hidden>
                    <i data-lucide="x" aria-hidden="true"></i>
                    <span>Clear</span>
                </button>
            </div>
            <div class="search-order" role="group" aria-label="Order search results">
                <span class="filter-label">Order</span>
                <button id="orderRelevanceButton" class="choice-button is-active" type="button">Relevance</button>
                <button id="orderSongButton" class="choice-button" type="button">Song title</button>
                <button id="orderArtistButton" class="choice-button" type="button">Artist</button>
            </div>
        </section>

        <section class="browse-tools" id="browseTools" aria-label="Browse tools" hidden>
            <div class="browse-choice" role="group" aria-label="Browse by">
                <button id="browseSongButton" class="choice-button is-active" type="button">Song title</button>
                <button id="browseArtistButton" class="choice-button" type="button">Artist</button>
            </div>
            <div class="letter-strip" id="letterStrip" aria-label="Browse letters"></div>
        </section>

        <section class="content-grid">
            <section class="results-panel" aria-labelledby="resultsTitle">
                <div class="panel-heading">
                    <div>
                        <h2 id="resultsTitle">Songs</h2>
                        <p id="resultCount"></p>
                    </div>
                    <div class="group-actions" id="groupActions" hidden>
                        <button id="expandGroupsButton" class="icon-button" type="button" title="Expand all" aria-label="Expand all groups">
                            <i data-lucide="chevrons-down" aria-hidden="true"></i>
                        </button>
                        <button id="collapseGroupsButton" class="icon-button" type="button" title="Collapse all" aria-label="Collapse all groups">
                            <i data-lucide="chevrons-up" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div class="results-list" id="resultsList"></div>
                <div class="result-actions" id="resultActions" hidden>
                    <button id="showMoreResultsButton" class="command subtle-command" type="button">Show more</button>
                    <button id="showAllResultsButton" class="command subtle-command" type="button">Show all</button>
                </div>
                <div class="browse-list" id="browseList" hidden></div>
            </section>

            <aside class="setlist-panel" aria-labelledby="setlistTitle">
                <div class="panel-heading">
                    <div>
                        <h2 id="setlistTitle">Setlist</h2>
                        <p id="setlistCount">0 songs</p>
                    </div>
                    <button id="copySetlistButton" class="icon-button" type="button" title="Copy setlist">
                        <i data-lucide="copy" aria-hidden="true"></i>
                    </button>
                    <button id="closeSetlistButton" class="icon-button close-setlist" type="button" title="Close setlist" aria-label="Close setlist">
                        <i data-lucide="x" aria-hidden="true"></i>
                    </button>
                </div>
                <ol class="setlist" id="setlist"></ol>
            </aside>
        </section>
    </main>

    <button id="mobileSetlistButton" class="mobile-setlist-button" type="button" aria-label="Open setlist">
        <i data-lucide="list-music" aria-hidden="true"></i>
        <span>Setlist</span>
    </button>

    <dialog id="dataDialog">
        <form method="dialog" class="dialog-body">
            <h2>Songbook data</h2>
            <p>Start a local server from this folder, or choose <code>karaoke_songs_enriched.json</code>.</p>
            <input id="fileInput" type="file" accept=".json,application/json">
            <button class="command" type="submit">Close</button>
        </form>
    </dialog>
</body>
</html>

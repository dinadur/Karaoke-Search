<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Karaoke Songbook</title>
    <meta name="theme-color" content="#f5f4fa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14121d" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A4%3C/text%3E%3C/svg%3E">
    <link rel="manifest" href="manifest.json">
    <link rel="preload" href="fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="karaoke_explorer.css?v=20260714-4">
    <script defer src="karaoke_explorer.js?v=20260714-4"></script>
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true" focusable="false">
        <symbol id="icon-search" viewBox="0 0 24 24"><path d="m21 21-4.34-4.34"/> <circle cx="11" cy="11" r="8"/></symbol>
        <symbol id="icon-shuffle" viewBox="0 0 24 24"><path d="m18 14 4 4-4 4"/> <path d="m18 2 4 4-4 4"/> <path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/> <path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/> <path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></symbol>
        <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/> <path d="m6 6 12 12"/></symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></symbol>
        <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/> <path d="M12 2v2"/> <path d="M12 20v2"/> <path d="m4.93 4.93 1.41 1.41"/> <path d="m17.66 17.66 1.41 1.41"/> <path d="M2 12h2"/> <path d="M20 12h2"/> <path d="m6.34 17.66-1.41 1.41"/> <path d="m19.07 4.93-1.41 1.41"/></symbol>
        <symbol id="icon-list-tree" viewBox="0 0 24 24"><path d="M8 5h13"/> <path d="M13 12h8"/> <path d="M13 19h8"/> <path d="M3 10a2 2 0 0 0 2 2h3"/> <path d="M3 5v12a2 2 0 0 0 2 2h3"/></symbol>
        <symbol id="icon-chevrons-down" viewBox="0 0 24 24"><path d="m7 6 5 5 5-5"/> <path d="m7 13 5 5 5-5"/></symbol>
        <symbol id="icon-chevrons-up" viewBox="0 0 24 24"><path d="m17 11-5-5-5 5"/> <path d="m17 18-5-5-5 5"/></symbol>
        <symbol id="icon-chevron-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
        <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
        <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
        <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
        <symbol id="icon-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/> <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
        <symbol id="icon-trash-2" viewBox="0 0 24 24"><path d="M10 11v6"/> <path d="M14 11v6"/> <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/> <path d="M3 6h18"/> <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
        <symbol id="icon-list-music" viewBox="0 0 24 24"><path d="M16 5H3"/> <path d="M11 12H3"/> <path d="M11 19H3"/> <path d="M21 16V5"/> <circle cx="18" cy="16" r="3"/></symbol>
        <symbol id="icon-star" viewBox="0 0 24 24"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></symbol>
        <symbol id="icon-headphones" viewBox="0 0 24 24"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></symbol>
        <symbol id="icon-tags" viewBox="0 0 24 24"><path d="M13.172 2a2 2 0 0 1 1.414.586l6.71 6.71a2.4 2.4 0 0 1 0 3.408l-4.592 4.592a2.4 2.4 0 0 1-3.408 0l-6.71-6.71A2 2 0 0 1 6 9.172V3a1 1 0 0 1 1-1z"/> <path d="M2 7v6.172a2 2 0 0 0 .586 1.414l6.71 6.71a2.4 2.4 0 0 0 3.191.193"/> <circle cx="10.5" cy="6.5" r=".5" fill="currentColor"/></symbol>
        <symbol id="icon-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/> <circle cx="6" cy="18" r="3"/> <circle cx="18" cy="16" r="3"/></symbol>
        <symbol id="icon-play-circle" viewBox="0 0 24 24"><path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z"/> <circle cx="12" cy="12" r="10"/></symbol>
        <symbol id="icon-grip-vertical" viewBox="0 0 24 24"><circle cx="9" cy="12" r="1"/> <circle cx="9" cy="5" r="1"/> <circle cx="9" cy="19" r="1"/> <circle cx="15" cy="12" r="1"/> <circle cx="15" cy="5" r="1"/> <circle cx="15" cy="19" r="1"/></symbol>
        <symbol id="icon-sliders-horizontal" viewBox="0 0 24 24"><path d="M10 5H3"/> <path d="M12 19H3"/> <path d="M14 3v4"/> <path d="M16 17v4"/> <path d="M21 12h-9"/> <path d="M21 19h-5"/> <path d="M21 5h-7"/> <path d="M8 10v4"/> <path d="M8 12H3"/></symbol>
        <symbol id="icon-share-2" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/> <circle cx="6" cy="12" r="3"/> <circle cx="18" cy="19" r="3"/> <line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/> <line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></symbol>
        <symbol id="icon-dices" viewBox="0 0 24 24"><rect width="12" height="12" x="2" y="10" rx="2" ry="2"/> <path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6"/> <path d="M6 18h.01"/> <path d="M10 14h.01"/> <path d="M15 6h.01"/> <path d="M18 9h.01"/></symbol>
    </svg>

    <header class="topbar">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">
                <i data-lucide="music" aria-hidden="true"></i>
            </div>
            <div>
                <p class="eyebrow">Karaoke songbook</p>
                <h1>Find tonight's song</h1>
            </div>
        </div>
        <div class="status" id="status" aria-live="polite">Loading songbook</div>
    </header>

    <main class="shell">
        <section class="toolbar" aria-label="Song search tools">
            <div class="search-box">
                <i data-lucide="search" aria-hidden="true"></i>
                <input id="searchInput" type="search" autocomplete="off" placeholder="Search song titles" aria-label="Search song titles">
                <label class="fuzzy-toggle">
                    <input id="fuzzySearch" type="checkbox">
                    <span>Fuzzy</span>
                </label>
            </div>
            <button id="randomButton" class="command" type="button" title="Random song">
                <i data-lucide="shuffle" aria-hidden="true"></i>
                <span>Random</span>
            </button>
            <button id="clearButton" class="icon-button" type="button" title="Clear search">
                <i data-lucide="x" aria-hidden="true"></i>
            </button>
            <button id="themeButton" class="icon-button" type="button" title="Dark mode" aria-label="Dark mode">
                <i data-lucide="moon" aria-hidden="true"></i>
            </button>
        </section>

        <section class="control-row" aria-label="View mode">
            <div class="mode-tabs" role="group" aria-label="View mode">
                <button id="searchModeButton" class="mode-tab is-active" type="button">
                    <i data-lucide="search" aria-hidden="true"></i>
                    <span>Search</span>
                </button>
                <button id="browseModeButton" class="mode-tab" type="button">
                    <i data-lucide="list-tree" aria-hidden="true"></i>
                    <span>Browse</span>
                </button>
            </div>
            <button id="filtersToggleButton" class="filters-toggle" type="button" aria-expanded="false" aria-controls="searchFilters">
                <i data-lucide="sliders-horizontal" aria-hidden="true"></i>
                <span>Filters</span>
                <span class="filter-count-badge" id="filterCountBadge" hidden></span>
            </button>
        </section>

        <section class="search-filters" id="searchFilters" aria-label="Filter search results">
            <div class="sheet-head">
                <h2>Search &amp; filters</h2>
                <button id="closeFiltersButton" class="icon-button" type="button" title="Close filters" aria-label="Close filters">
                    <i data-lucide="x" aria-hidden="true"></i>
                </button>
            </div>
            <div class="search-scope" id="searchScope" role="radiogroup" aria-label="Search in">
                <label>
                    <input type="radio" name="searchScope" value="all" checked>
                    <span>Songs &amp; artists</span>
                </label>
                <label>
                    <input type="radio" name="searchScope" value="song">
                    <span>Song title</span>
                </label>
                <label>
                    <input type="radio" name="searchScope" value="artist">
                    <span>Artist</span>
                </label>
            </div>
            <div class="select-filter multi-filter" data-filter="mood"></div>
            <div class="select-filter multi-filter" data-filter="genre"></div>
            <div class="select-filter multi-filter" data-filter="decade"></div>
            <div class="select-filter multi-filter" data-filter="holiday"></div>
            <div class="filter-checks" aria-label="More filters">
                <label>
                    <input id="duetFilter" type="checkbox">
                    <span>Duet</span>
                </label>
                <label>
                    <input id="favoriteFilter" type="checkbox">
                    <span>Favorites</span>
                </label>
                <button id="clearFiltersButton" class="filter-clear" type="button" title="Clear filters" hidden>
                    <i data-lucide="x" aria-hidden="true"></i>
                    <span>Clear</span>
                </button>
            </div>
            <div class="search-order" role="group" aria-label="Order search results">
                <span class="filter-label">Order</span>
                <button id="orderRelevanceButton" class="choice-button is-active" type="button">Relevance</button>
                <button id="orderSongButton" class="choice-button" type="button">Song title</button>
                <button id="orderArtistButton" class="choice-button" type="button">Artist</button>
            </div>
            <div class="sheet-foot">
                <button id="applyFiltersButton" class="command apply-filters" type="button">Show songs</button>
            </div>
        </section>
        <section class="active-filters" id="activeFilters" aria-label="Active filters" hidden></section>

        <section class="browse-tools" id="browseTools" aria-label="Browse tools" hidden>
            <div class="browse-choice" role="group" aria-label="Browse by">
                <button id="browseSongButton" class="choice-button is-active" type="button">Song title</button>
                <button id="browseArtistButton" class="choice-button" type="button">Artist</button>
            </div>
            <div class="letter-strip" id="letterStrip" aria-label="Browse letters"></div>
        </section>

        <section class="content-grid">
            <section class="results-panel" aria-labelledby="resultsTitle">
                <div class="panel-heading">
                    <div>
                        <h2 id="resultsTitle">Songs</h2>
                        <p id="resultCount" aria-live="polite"></p>
                    </div>
                    <button id="shuffleShelvesButton" class="icon-button" type="button" title="Shuffle the shelves" aria-label="Shuffle the shelves" hidden>
                        <i data-lucide="dices" aria-hidden="true"></i>
                    </button>
                    <div class="group-actions" id="groupActions" hidden>
                        <button id="expandGroupsButton" class="icon-button" type="button" title="Expand all" aria-label="Expand all groups">
                            <i data-lucide="chevrons-down" aria-hidden="true"></i>
                        </button>
                        <button id="collapseGroupsButton" class="icon-button" type="button" title="Collapse all" aria-label="Collapse all groups">
                            <i data-lucide="chevrons-up" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div class="result-context" id="resultContext" hidden></div>
                <div class="search-notice" id="searchNotice" hidden></div>
                <div class="random-pick" id="randomPick" hidden></div>
                <div class="results-list" id="resultsList"></div>
                <div class="results-sentinel" id="resultsSentinel" aria-hidden="true"></div>
                <div class="result-actions" id="resultActions" hidden>
                    <button id="showMoreResultsButton" class="command subtle-command" type="button">Show more</button>
                    <button id="showAllResultsButton" class="command subtle-command" type="button">Show all</button>
                </div>
                <div class="browse-list" id="browseList" hidden></div>
            </section>

            <aside class="setlist-panel" aria-labelledby="setlistTitle">
                <div class="panel-heading">
                    <div>
                        <h2 id="setlistTitle">Setlist</h2>
                        <p id="setlistCount">0 songs</p>
                    </div>
                    <button id="shareSetlistButton" class="icon-button" type="button" title="Share setlist" aria-label="Share setlist" hidden>
                        <i data-lucide="share-2" aria-hidden="true"></i>
                    </button>
                    <button id="copySetlistButton" class="icon-button" type="button" title="Copy setlist">
                        <i data-lucide="copy" aria-hidden="true"></i>
                    </button>
                    <button id="clearSetlistButton" class="icon-button" type="button" title="Clear setlist" aria-label="Clear setlist">
                        <i data-lucide="trash-2" aria-hidden="true"></i>
                    </button>
                    <button id="closeSetlistButton" class="icon-button close-setlist" type="button" title="Close setlist" aria-label="Close setlist">
                        <i data-lucide="x" aria-hidden="true"></i>
                    </button>
                </div>
                <ol class="setlist" id="setlist"></ol>
            </aside>
        </section>
    </main>

    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>

    <div class="snackbar" id="snackbar" role="status" hidden>
        <span id="snackbarText"></span>
        <button id="snackbarAction" type="button">Undo</button>
    </div>

    <button id="mobileSetlistButton" class="mobile-setlist-button" type="button" aria-label="Open setlist">
        <i data-lucide="list-music" aria-hidden="true"></i>
        <span>Setlist</span>
    </button>

    <dialog id="dataDialog">
        <form method="dialog" class="dialog-body">
            <h2>Songbook data</h2>
            <p>Start a local server from this folder, or choose <code>karaoke_songs_enriched.json</code>.</p>
            <input id="fileInput" type="file" accept=".json,application/json">
            <button class="command" type="submit">Close</button>
        </form>
    </dialog>
</body>
</html>
